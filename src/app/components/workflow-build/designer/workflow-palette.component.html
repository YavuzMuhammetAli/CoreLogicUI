<div class="palette" role="toolbar" [attr.aria-label]="'workflow.palette.aria' | t">
  @for (group of groups; track group.titleKey) {
  <span class="eyebrow palette-title">{{ group.titleKey | t }}</span>

  @for (kind of group.kinds; track kind.kind) {
    <button type="button" class="palette-item"
            [attr.data-kind]="kind.kind"
            [attr.data-tone]="kind.tone"
            [disabled]="disabled() || isUnavailable(kind.kind)"
            [draggable]="!disabled() && !isUnavailable(kind.kind)"
            (dragstart)="onDragStart($event, kind.kind)"
            (click)="add.emit(kind.kind)"
            [title]="(isUnavailable(kind.kind) ? 'workflow.palette.unavailable' : kind.descriptionKey) | t">
      <span class="palette-icon" aria-hidden="true">
        <app-icon [name]="kind.icon" size="16" />
      </span>
      <span class="palette-label">{{ kind.labelKey | t }}</span>
    </button>
  }
  }

  <p class="palette-help">{{ 'workflow.palette.help' | t }}</p>
</div>
