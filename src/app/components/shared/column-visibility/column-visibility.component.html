<div class="col-vis-wrap" #wrapRef>
  <button
    type="button"
    class="btn btn-ghost btn-sm"
    (click)="toggleOpen(); $event.stopPropagation()"
    [attr.aria-expanded]="open()"
    aria-haspopup="true"
    [attr.aria-label]="'shared.columnVisibility.toggleLabel' | t">
    <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <rect x="3" y="4" width="7" height="16" rx="1"/>
      <rect x="14" y="4" width="7" height="16" rx="1"/>
    </svg>
    {{ 'shared.columnVisibility.buttonLabel' | t }}
  </button>

  @if (open()) {
    <div class="col-vis-dropdown" role="menu" [attr.aria-label]="'shared.columnVisibility.menuLabel' | t">
      <div class="col-vis-header">{{ 'shared.columnVisibility.header' | t }}</div>

      <div class="col-vis-list">
        @for (col of columns; track col.name) {
          <label class="checkbox-label" [class.checkbox-label--disabled]="col.required">
            <input
              type="checkbox"
              [checked]="isChecked(col.name)"
              [disabled]="col.required"
              (change)="toggle(col)">
            {{ col.name }}
            @if (col.required) {
              <span class="col-vis-required">{{ 'shared.columnVisibility.requiredBadge' | t }}</span>
            }
          </label>
        }
        @if (columns.length === 0) {
          <p class="col-vis-empty">{{ 'shared.columnVisibility.empty' | t }}</p>
        }
      </div>

      @if (!canSave) {
        <p class="col-vis-hint" role="alert">{{ 'shared.columnVisibility.minOneHint' | t }}</p>
      }

      <div class="col-vis-footer">
        <button type="button" class="btn btn-primary btn-sm" (click)="submit()" [disabled]="saving || !canSave">
          @if (saving) {
            <span class="spinner" [attr.aria-label]="'shared.columnVisibility.savingLabel' | t"></span>
          } @else {
            {{ 'common.save' | t }}
          }
        </button>
      </div>
    </div>
  }
</div>
