<!-- The bubble usually sits inside a <label>; the event is stopped so the click doesn't
     activate the label's control (doesn't toggle the checkbox). -->
<span
  #bubble
  class="info-bubble"
  [class.info-bubble--formula]="variant() === 'formula'"
  tabindex="0"
  [attr.aria-label]="label() ?? text()"
  (mouseenter)="show()"
  (mouseleave)="hide()"
  (focus)="show()"
  (blur)="hide()"
  (click)="$event.preventDefault(); $event.stopPropagation(); onTap()">
  {{ glyph() }}
  <!-- `position: fixed` — escapes clipping containers; the position is computed in TS and
       clamped to the viewport (see the HelpHintComponent doc comment). -->
  <span
    #tip
    class="info-bubble__tip"
    [class.info-bubble__tip--open]="open()"
    [class.info-bubble__tip--below]="resolved() === 'below'"
    [style.top.px]="top()"
    [style.left.px]="left()"
    role="tooltip">{{ text() }}</span>
</span>
