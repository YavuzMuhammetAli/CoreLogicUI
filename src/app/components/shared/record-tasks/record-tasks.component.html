<!-- Bu kayıtta kullanıcıya düşen bekleyen görev yoksa hiçbir şey çizilmez. -->
@if (tasks().length > 0) {
  <div class="flow record-tasks">
    @for (task of tasks(); track task.id) {
      <app-task-decision-form [task]="task" [heading]="task.name" (completed)="onCompleted(task, $event)">
        <span decisionEyebrow class="eyebrow">{{ 'task.record.eyebrow' | t }}</span>

        <div decisionMeta class="task-meta">
          <span class="task-meta-item">{{ task.workflowName }}</span>
          <span class="task-meta-item">
            {{ 'task.list.colDue' | t }}: {{ dueLabel(task) }}
            @if (task.isOverdue) {
              <span class="badge badge-danger">{{ 'task.list.overdue' | t }}</span>
            }
          </span>
          <a [routerLink]="['/tasks', task.id]" class="btn btn-ghost btn-sm">
            {{ 'task.record.openTask' | t }}
          </a>
        </div>
      </app-task-decision-form>
    }
  </div>
}
