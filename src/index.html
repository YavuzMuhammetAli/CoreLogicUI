<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <title>CoreLogic</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="theme-init.js"></script>
  <!-- Boot indicator: shown instead of a blank white page until the app bundles load and the first screen is drawn.
       Angular replaces the <app-root> content itself on the first render. -->
  <style>
    .boot-splash { position: fixed; inset: 0; display: grid; place-items: center; background: #f8fafc; }
    [data-theme="dark"] .boot-splash { background: #0b1220; }
    .boot-splash::after {
      content: ""; width: 28px; height: 28px; border-radius: 50%;
      border: 3px solid rgba(29, 78, 216, .25); border-top-color: #1d4ed8;
      animation: boot-spin .8s linear infinite;
    }
    @keyframes boot-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .boot-splash::after { animation: none; } }
  </style>
</head>
<body>
  <app-root><div class="boot-splash" role="progressbar" aria-label="Yükleniyor"></div></app-root>
</body>
</html>
